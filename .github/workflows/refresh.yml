# Redeploy on a schedule so the baked data stays current.
#
# Once a day, deliberately. Netlify bills every successful production deploy at
# 15 credits; the Personal plan has 1,000 a month, so a daily rebuild (~450)
# leaves room for code pushes (15 each) and bandwidth (20 per GB). Twice a day
# (~900) used up the free plan's 300 and paused the site on 2026-10-07. The
# feeds carry their own 4h-to-7d TTLs, so a daily bake keeps every one of them
# within a day. Add the hook URL from Netlify (Project configuration → Build &
# deploy → Build hooks) as the NETLIFY_BUILD_HOOK repository secret.
name: Refresh data

on:
  schedule:
    - cron: '0 13 * * *'   # 06:00 Pacific
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Netlify build
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "NETLIFY_BUILD_HOOK is not set — add it in repo settings → Secrets."
            exit 1
          fi
          curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
          echo "Build triggered."
